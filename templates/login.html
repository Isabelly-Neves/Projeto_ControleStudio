{% extends "base.html" %}
{% block titulo %}Furo Delicado: entrar{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    {{ csrf_input() }}
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>

    <p><button class="botao" type="submit">Entrar</button></p>
  </form>
{% endblock %}
