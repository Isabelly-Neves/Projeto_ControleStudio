{% extends "base.html" %}
{% block titulo %}Furo Delicado: resumo do mês{% endblock %}
{% block conteudo %}
  <h1>Resumo de {{ mes }}</h1>
  <div class="linha"><span class="discreto">Entrou</span><span class="valor">{{ entrou | brl }}</span></div>
  <div class="linha"><span class="discreto">Saiu</span><span class="valor">{{ saiu | brl }}</span></div>
  <div class="linha"><span class="discreto">Lucro</span><span class="valor">{{ lucro | brl }}</span></div>
{% endblock %}
