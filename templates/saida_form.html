{% extends "base.html" %}
{% block titulo %}Furo Delicado: {{ 'editar' if editando else 'lançar' }} saída{% endblock %}
{% block conteudo %}
  <h1>{{ 'Editar saída' if editando else 'Lançar saída' }}</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    <label for="data">Data</label>
    <input type="date" id="data" name="data" value="{{ form.data }}" required>

    <label for="categoria_id">Categoria</label>
    <select id="categoria_id" name="categoria_id" required>
      <option value="">Escolha...</option>
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if form.categoria_id == c.id | string %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>

    <label for="valor">Valor (R$)</label>
    <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="50,00" value="{{ form.valor }}" required>

    <label for="descricao">Descrição (opcional)</label>
    <input type="text" id="descricao" name="descricao" value="{{ form.descricao }}">

    <p>
      <button class="botao" type="submit">{{ 'Salvar alterações' if editando else 'Salvar saída' }}</button>
      <a class="botao-secundario" href="{{ url_for('saidas') }}">Cancelar</a>
    </p>
  </form>

  {% if editando %}
    <form method="post" action="{{ url_for('saida_apagar', saida_id=saida_id) }}"
          onsubmit="return confirm('Apagar esta saída? Isso não pode ser desfeito.')">
      <button class="botao-perigo" type="submit">Apagar saída</button>
    </form>
  {% endif %}
{% endblock %}
