{% extends "base.html" %}
{% block titulo %}Furo Delicado: lançar saída{% endblock %}
{% block conteudo %}
  <h1>Lançar saída</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    <label for="data">Data</label>
    <input type="date" id="data" name="data" value="{{ form.data }}" required>

    <label for="categoria_id">Categoria</label>
    <select id="categoria_id" name="categoria_id" required>
      <option value="">Escolha...</option>
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if form.categoria_id == c.id | string %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>

    <label for="valor">Valor (R$)</label>
    <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="50,00" value="{{ form.valor }}" required>

    <label for="descricao">Descrição (opcional)</label>
    <input type="text" id="descricao" name="descricao" value="{{ form.descricao }}">

    <p><button class="botao" type="submit">Salvar saída</button></p>
  </form>
{% endblock %}
